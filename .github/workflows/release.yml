name: Build and release APK

on:
  push:
    tags:
      - 'v*'          # e.g. git tag v1.0.0 && git push origin v1.0.0
  workflow_dispatch:   # lets you run it manually from the Actions tab

permissions:
  contents: write      # needed to create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo only holds lib/ + pubspec.yaml; generate the Android project
      # around them, keeping our own files untouched.
      - name: Generate Android project
        run: |
          mkdir -p "$RUNNER_TEMP/keep"
          cp -r lib pubspec.yaml "$RUNNER_TEMP/keep/"
          flutter create --platforms=android --org com.example --project-name textchat .
          rm -rf lib pubspec.yaml test
          cp -r "$RUNNER_TEMP/keep/lib" lib
          cp "$RUNNER_TEMP/keep/pubspec.yaml" pubspec.yaml

      - name: Allow internet access in release builds
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "INTERNET" android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: textchat-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
